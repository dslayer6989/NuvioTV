name: Build Nuvio Live TV (Android TV)

# Our own Android TV build. The official upstream workflow (android-release.yml) is left alone.
on:
  workflow_dispatch:
  # TEMPORARY: lets us start this from the dev branch before the file exists on main.
  # Remove this block (and .github/livetv/run-build.txt) once the workflow is merged to main.
  push:
    branches: [dev]
    paths: ['.github/livetv/run-build.txt']

concurrency:
  group: live-tv-tv-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_ID: com.nuvio.app.livetv.atv
  APP_LABEL: Nuvio Live TV
  KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
  LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # No submodules: NuvioTV has none (only a stale pointer), and upstream doesn't fetch them either.
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key and optional local.properties
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/livetv.jks"
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${KEYSTORE_PASSWORD}"
          else
            echo "::warning::No LIVE_TV_KEYSTORE secrets set; using a one-off key. Installing a later build will require uninstalling this one first."
            password="livetv-temp-key"
            keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Live TV"
          fi
          echo "NUVIO_RELEASE_STORE_FILE=${keystore}" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_ALIAS=livetv" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_STORE_PASSWORD=${password}" >> "$GITHUB_ENV"
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            # The CI machine's SDK/keystore paths must not leak in from the stored file.
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            echo "::warning::No LOCAL_PROPERTIES_BASE64 secret; Trakt and other keyed features will be empty."
          fi

      # Build-time only edits (not committed): app id, update source and app name.
      - name: Set app id, update source and app name
        run: |
          set -euo pipefail
          f=app/build.gradle.kts
          sed -i "s|applicationId = \"com.nuvio.tv\"|applicationId = \"${APP_ID}\"|" "$f"
          sed -i "s|\\\\\"NuvioMedia\\\\\"|\\\\\"${GITHUB_REPOSITORY_OWNER}\\\\\"|" "$f"
          grep -n "applicationId = \"${APP_ID}\"" "$f"
          grep -n "GITHUB_OWNER" "$f"
          grep -q "applicationId = \"${APP_ID}\"" "$f"
          grep "GITHUB_OWNER" "$f" | grep -q "${GITHUB_REPOSITORY_OWNER}"
          # Change the app name in every language file so the launcher shows "Nuvio Live TV".
          find app/src -path '*/res/values*/strings.xml' -exec sed -i -E "s|(<string name=\"app_name\"[^>]*>)[^<]*(</string>)|\1${APP_LABEL}\2|" {} +
          grep -rn 'name="app_name"' app/src/main/res/values/strings.xml

      - name: Build the Android TV APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullRelease --stacktrace

      - name: Collect the APK
        run: |
          set -euo pipefail
          ls -la app/build/outputs/apk/full/release/
          apk="$(ls app/build/outputs/apk/full/release/*universal*.apk | head -n 1)"
          mkdir -p dist
          cp "${apk}" dist/Nuvio-LiveTV-Android-TV.apk
          # The runner has several build-tools versions; use only the newest aapt.
          aapt="$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt | sort -V | tail -n 1)"
          echo "Using ${aapt}"
          "${aapt}" dump badging dist/Nuvio-LiveTV-Android-TV.apk > badging.txt
          grep -E "package:|application-label:|leanback" badging.txt | head
          grep -q "package: name='${APP_ID}'" badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: dist/Nuvio-LiveTV-Android-TV.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="live-tv-tv-${GITHUB_RUN_NUMBER}"
          printf 'Nuvio Live TV for Android TV, build %s.\nBuilt from commit %s. Installs next to official Nuvio (app id %s).\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA}" "${APP_ID}" > notes.md
          gh release create "${tag}" dist/Nuvio-LiveTV-Android-TV.apk --title "Nuvio Live TV (Android TV) — build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}" --latest
